# Pornire fără așteptare; ține Shift pentru meniu
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_DISTRIBUTOR="ACM OS"
# mitigations=off: Core 2 Duo pierde mult (până la 30%) cu protecțiile Spectre/Meltdown; nowatchdog: pornire mai rapidă
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 nowatchdog mitigations=off"
