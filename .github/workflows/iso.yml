name: ACM OS - build si test
# Logica e in ci/run.sh (se poate schimba fara a edita acest fisier).
#   git tag iso-X.Y.Z  -> ISO + capturi din VM + publicare
#   git tag test-NUME  -> ISO + capturi din VM
on:
  push:
    tags: ['iso-*', 'test-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Activeaza KVM (calculator virtual rapid)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build ISO + test vizual
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/run.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acm-os
          path: |
            out/
            shots/
          retention-days: 30
          compression-level: 0
